<style>
/* ---------- Layout: portrait = top/bottom, landscape = left/right ---------- */

 font:var(--fs)/var(--lh) ui-monospace,Menlo,Consolas,monospace;tab-size:var(--ts);

#hl{overflow:hidden;pointer-events:none;color:#d4d4d4;counter-reset:n}

</style></head><body>
<div id="app">
 <div id="ed">
  <pre id="hl"></pre>
  <textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="soft"></textarea>
  <div class="fab" style="right:6px;top:4px"><button id="tab">⇥</button><button id="mb">⋮</button></div>

 </div>

   <div id="rs">◢</div>
  </div>
 </div>

<script>
const $=id=>document.getElementById(id);
const ta=$('ta'),hl=$('hl'),fr=$('fr'),pv=$('pv'),stage=$('stage'),app=$('app'),ed=$('ed');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const M='\u0000', VOID=/^(br|hr|img|input|meta|link|area|base|col|embed|source|track|wbr)$/;
const PAIRS={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'};
let fname=store.get('fname')||'index.html', z=1, prevV='', loaded=false, lastSig='';
let fsv=+store.get('fs')||14, ts=+store.get('ts')||2, wrap=store.get('wrap')!=='0', tabBtn=store.get('tabbtn')!=='0', IND='  ';

/* ================= 1. Syntax colors (VS Code Dark+) ================= */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function tok(s,re,cls){let o='',i=0,m;re.lastIndex=0; // each regex group = one color

  o+='<span class="'+cls[g-1]+'">'+esc(m[0])+'</span>';i=re.lastIndex;}

const hlJs=s=>tok(s,/(\/\/.*|\/\*[\s\S]*?(?:\*\/|$))|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(const|let|var|function|return|if|else|for|while|new|class|import|export|from|async|await|try|catch|throw|switch|case|break|continue|this|typeof|of|in|default|true|false|null|undefined)\b|(\b\d+\.?\d*\b)|([A-Za-z_$][\w$]*)(?=\()/g,['c','s','k','n','f']);
const hlCss=s=>tok(s,/(\/\*[\s\S]*?(?:\*\/|$))|("[^"\n]*"|'[^'\n]*')|(#[0-9a-fA-F]{3,8}\b)|((?<![\w#-])-?(?:\d+\.?\d*|\.\d+)(?:px|em|rem|%|vh|vw|s|deg|fr)?)|(@[\w-]+)|([\w-]+)(?=\s*:)|([.#][\w-]+)/gi,['c','s','n','n','k','a','y']);
const hlAttr=s=>tok(s,/("[^"]*"|'[^']*')|([\w:@.-]+)(?=\s*=)|(=)|([\w:@.-]+)/g,['s','a','p','a']);
function hlHtml(s){

  o+=esc(s.slice(i,m.index));i=re.lastIndex;
  if(!m[2]){o+='<span class="'+(m[0][2]=='-'?'c':'d')+'">'+esc(m[0])+'</span>';continue}
  o+='<span class="p">'+esc(m[1])+'</span><span class="t">'+m[2]+'</span>'+hlAttr(m[3])+'<span class="p">'+m[4]+'</span>';
  const t=m[2].toLowerCase();
  if(m[1]=='<'&&(t=='style'||t=='script')){ // code inside <style> / <script>
   let e=s.toLowerCase().indexOf('</'+t,i);if(e<0)e=s.length;
   o+=(t=='style'?hlCss:hlJs)(s.slice(i,e));i=e;re.lastIndex=e;}
 }

const lang=()=>/\.css$/i.test(fname)?'css':/\.js$/i.test(fname)?'js':'html';
// Every code line becomes one <div> (so wrapped lines and line numbers stay correct)
function render(){
 const v=ta.value,L=lang(),h=L=='css'?hlCss(v):L=='js'?hlJs(v):hlHtml(v);let open='';
 hl.innerHTML=h.split('\n').map(l=>{
  const g=l.replace(/^ +/,m=>'<i></i>'.repeat(Math.floor(m.length/ts))+' '.repeat(m.length%ts)); // indent guides
  const pre=open?'<span class="'+open+'">':'';let o=open,m;const re=/<span class="(\w+)">|<\/span>/g;
  while((m=re.exec(l)))o=m[1]||''; // keep colors alive on multi-line comments/strings
  open=o;return '<div class="l">'+pre+(g||'&#8203;')+(o?'</span>':'')+'</div>';}).join('');
 syncScroll();}
function syncScroll(){hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft}

/* ================= 2. Live preview (no reload, keeps scroll) ================= */
const sigOf=c=>[...new DOMParser().parseFromString(c,'text/html').scripts].map(s=>s.src+'|'+s.textContent).join('\u0001');
function setAttrs(a,b){
 for(const x of [...a.attributes])if(!b.hasAttribute(x.name))a.removeAttribute(x.name);

function sync(a,b){ // change only what is different

  const x=ak[i],y=bk[i];

  if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(a.ownerDocument.importNode(y,true),x);continue}
  if(x.nodeType===3||x.nodeType===8){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}
  if(x.nodeName==='SCRIPT')continue;

function fullReload(code){ // first load, or when JavaScript changed. Scroll is restored.

 fr.onload=()=>{loaded=true;lastSig=sigOf(code);const w2=fr.contentWindow;applyBw();w2.scrollTo(sx,sy);hook();setTimeout(()=>w2.scrollTo(sx,sy),80)};
 fr.srcdoc=code;}
let fullT,pinT;
function setPreview(code){
 if(lang()!=='html')return;
 const d=fr.contentDocument;
 if(!loaded||!d||!d.body){fullReload(code);return}
 if(sigOf(code)!==lastSig){clearTimeout(fullT);fullT=setTimeout(()=>fullReload(ta.value),600);return}
 const w=fr.contentWindow,sx=w.scrollX,sy=w.scrollY,h=d.documentElement,hh=h.scrollHeight;
 const nd=new DOMParser().parseFromString(code,'text/html');
 setAttrs(h,nd.documentElement);sync(d.head,nd.head);setAttrs(d.body,nd.body);sync(d.body,nd.body);
 h.style.minHeight=hh+'px';w.scrollTo(sx,sy); // page never gets shorter while you type, so scroll cannot jump
 clearTimeout(pinT);pinT=setTimeout(()=>{h.style.minHeight=''},900);}
let t1;function schedule(){clearTimeout(t1);t1=setTimeout(()=>setPreview(ta.value),50);store.set('code',ta.value)}
function pinch(el,fn){let pd=0; // two-finger pinch
 el.addEventListener('touchmove',e=>{if(e.touches.length!==2){pd=0;return}e.preventDefault();
  const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.screenX-b.screenX,a.screenY-b.screenY);if(pd)fn(d/pd);pd=d},{passive:false});
 el.addEventListener('touchend',()=>pd=0);}
let bw=store.get('bw')!=='0'; // break very long words so the page never scrolls sideways

$('bw').checked=bw;$('bw').onchange=()=>{bw=$('bw').checked;store.set('bw',bw?1:0);applyBw()};
function hook(){const d=fr.contentDocument;if(d)pinch(d,r=>setZ(z*r))}
pinch(ta,r=>setFs(fsv*r)); // pinch the code = bigger / smaller text

/* ================= 3. Preview size, zoom, divider ================= */
const W=$('W'),H=$('H'),Z=$('Z'),Ws=$('Ws'),Hs=$('Hs');
function layout(){
 const r=pv.getBoundingClientRect();
 const w=+W.value||Math.max(50,Math.round(r.width/z)),h=+H.value||Math.max(50,Math.round(r.height/z));
 fr.style.width=w+'px';fr.style.height=h+'px';fr.style.transform='scale('+z+')';
 stage.style.width=w*z+'px';stage.style.height=h*z+'px';Ws.value=w;Hs.value=h;if(P.classList.contains('on'))place(P.offsetLeft,P.offsetTop);}
function setZ(n){z=Math.min(2,Math.max(.2,n));Z.value=Math.round(z*100);$('zv').textContent=Math.round(z*100)+'%';layout()}
W.oninput=H.oninput=layout;Z.oninput=()=>setZ(Z.value/100);
Ws.oninput=()=>{W.value=Ws.value;layout()};Hs.oninput=()=>{H.value=Hs.value;layout()};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.p.split(',');W.value=+w||'';H.value=+h||'';layout()});
$('fit').onclick=()=>{const r=pv.getBoundingClientRect();if(+W.value&&+H.value)setZ(Math.min(r.width/W.value,r.height/H.value))};
$('rot').onclick=()=>{const t=W.value;W.value=H.value;H.value=t;layout()};
$('rl').onclick=()=>fullReload(ta.value);
new ResizeObserver(layout).observe(pv);
const bar=$('bar');let drag=false; // divider
bar.onpointerdown=e=>{bar.setPointerCapture(e.pointerId);drag=true};
bar.onpointermove=e=>{if(!drag)return;const r=app.getBoundingClientRect(),row=getComputedStyle(app).flexDirection==='row';
 const size=row?r.width:r.height,pos=row?e.clientX-r.left:e.clientY-r.top;
 ed.style.flexBasis=Math.min(Math.max(pos-8,60),size-84)+'px'};
bar.onpointerup=bar.onpointercancel=()=>drag=false;
matchMedia('(orientation:landscape)').onchange=()=>ed.style.flexBasis='50%';
$('mb').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('menu').classList.remove('on')});
/* ---- Settings window: move it (drag the top row), resize it (corner or two-finger pinch), change its visibility ---- */
const P=$('panel'),box=$('pvw'),op=$('op');let ps=+store.get('ps')||1;
function place(x,y){const b=box.getBoundingClientRect(),w=P.offsetWidth*ps,h=P.offsetHeight*ps;
 x=Math.min(Math.max(0,x),Math.max(0,b.width-w));y=Math.min(Math.max(0,y),Math.max(0,b.height-h));
 P.style.left=x+'px';P.style.top=y+'px';P.style.right='auto';store.set('pp',x+','+y)}
function scaleP(n){ps=Math.min(2,Math.max(.5,n));P.style.transform='scale('+ps+')';store.set('ps',ps)}
function restore(){scaleP(ps);const pp=(store.get('pp')||'').split(',');
 if(pp.length==2)place(+pp[0],+pp[1]);else place(box.getBoundingClientRect().width-P.offsetWidth*ps-12,38)}
$('gear').onclick=e=>{e.stopPropagation();P.classList.toggle('on');if(P.classList.contains('on'))restore()};
$('px').onclick=()=>P.classList.remove('on');
const ph=$('ph');let dg=null;
ph.onpointerdown=e=>{if(e.target.closest('input,button'))return;ph.setPointerCapture(e.pointerId);dg={x:e.clientX-P.offsetLeft,y:e.clientY-P.offsetTop}};
ph.onpointermove=e=>{if(dg)place(e.clientX-dg.x,e.clientY-dg.y)};
ph.onpointerup=ph.onpointercancel=()=>dg=null;
const rs=$('rs');let rz=null;
rs.onpointerdown=e=>{rs.setPointerCapture(e.pointerId);rz={s:ps,x:e.clientX,w:P.offsetWidth*ps}};
rs.onpointermove=e=>{if(rz)scaleP(rz.s*(rz.w+e.clientX-rz.x)/rz.w)};
rs.onpointerup=rs.onpointercancel=()=>rz=null;
pinch(P,r=>scaleP(ps*r));
op.value=+store.get('op')||55;P.style.opacity=op.value/100;
op.oninput=()=>{P.style.opacity=op.value/100;store.set('op',op.value)};

/* ================= 4. Smart editing ================= */
let inserting=false,busy=false;
function ins(t){ // insert text the way the keyboard does, so Undo (Ctrl+Z) still works
 const was=inserting;inserting=true;
 try{t.split('\n').forEach((p,i)=>{if(i)document.execCommand('insertLineBreak');if(p)document.execCommand('insertText',false,p)})}
 finally{inserting=was}}
const OPEN=/<([A-Za-z][\w-]*)(?:"[^"]*"|'[^']*'|[^<>"'])*>$/;
const lineB=(v,s)=>v.slice(v.lastIndexOf('\n',s-1)+1,s);
// true when the cursor is inside { } of CSS (a .css file or a <style> block)
function cssBlock(v,s){const b=v.slice(0,s);let c=b;
 if(lang()==='html'){const a=b.lastIndexOf('<style');if(a<0||a<b.lastIndexOf('</style'))return false;c=b.slice(a)}

// Enter: keep indentation, add one level after an opening tag or { [ (, and put the closing part on its own line
function enter(){

// ---- Emmet: HTML ----
const boiler=()=>'<!DOCTYPE html>\n<html lang="en">\n<head>\n'+IND+'<meta charset="UTF-8">\n'+IND+'<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'+IND+'<title>Document</title>\n</head>\n<body>\n'+IND+M+'\n</body>\n</html>';
const DEF={a:' href=""',img:' src="" alt=""',link:' rel="stylesheet" href=""',script:' src=""',input:' type="text"',form:' action=""'};
function gen(parts,d){ // examples: ul>li.item$*3  a[href=#]{Link}  div#a+div#b
 const sibs=parts[0].split('+'),pad=IND.repeat(d),out=[];
 sibs.forEach((s,k)=>{
  const m=/^([\w-]*)((?:[.#][\w$-]+)*)(?:\[([^\]]*)\])?(?:\{([^}]*)\})?(?:\*(\d+))?$/.exec(s);if(!m)throw 0;
  const tag=m[1]||'div',kids=k==sibs.length-1&&parts.length>1;
  for(let n=1;n<=(+m[5]||1);n++){
   const q=x=>x.replace(/\$/g,n),id=(/#([\w$-]+)/.exec(m[2])||[])[1],cls=(m[2].match(/\.[\w$-]+/g)||[]).map(c=>q(c.slice(1))).join(' ');
   let at=(id?' id="'+q(id)+'"':'')+(cls?' class="'+cls+'"':'');
   if(m[3])at+=m[3].trim().split(/\s+/).map(a=>{const[p,...v]=a.split('=');return ' '+p+'="'+q(v.join('='))+'"'}).join('');
   else at+=DEF[tag]||'';
   if(VOID.test(tag)){out.push(pad+'<'+tag+at+'>');continue}
   if(kids)out.push(pad+'<'+tag+at+'>',gen(parts.slice(1),d+1),pad+'</'+tag+'>');
   else out.push(pad+'<'+tag+at+'>'+q(m[4]||'')+(m[4]?'':M)+'</'+tag+'>');}
 });

// ---- Emmet: CSS (df, jcc, aic, m10, p20, w100p, fz16, br8 ...) ----
